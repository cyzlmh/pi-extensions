# Auto-publish on merge to main.
#
# Release flow: bump `version` in a package's package.json, commit to main.
# For every package, if that version is not yet on npm, publish it.
# Idempotent: re-running publishes nothing; unchanged packages are skipped.
#
# Uses npm Trusted Publishing (GitHub Actions OIDC): no NPM_TOKEN or OTP.
# Each npm package must once be bound to cyzlmh/pi-extensions / publish.yml
# in its npm Trusted Publisher settings (or with `npm trust github`).

name: publish

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires Node >=22.14 and npm >=11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish changed packages
        run: |
          set -euo pipefail
          for pkg in */package.json; do
            dir=$(dirname "$pkg")
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            private=$(node -p "require('./$pkg').private || false")
            if [ "$private" = "true" ]; then
              echo "skip $name (private)"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            echo "publishing $name@$version"
            (cd "$dir" && npm publish --access public)
          done
